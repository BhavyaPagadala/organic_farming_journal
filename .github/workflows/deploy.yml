name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        working-directory: organic_farming_journal_cross_platform
        run: flutter pub get

      - name: Build Web app
        working-directory: organic_farming_journal_cross_platform
        run: flutter build web --release --base-href "/organic_farming_journal/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: organic_farming_journal_cross_platform/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
